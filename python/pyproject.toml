[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cap-sdk"
version = "0.1.0"
description = "Python SDK for the Cooperative Agent Protocol (CAP) — Core + Construction Domain Pack v0"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "CAP Authors" },
]
keywords = ["cooperative-agent", "construction", "agriculture", "robotics", "protocol", "grpc", "multi-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # gRPC pinned to match the matrix in CAP CI (ADR-008 versioning policy).
    "grpcio>=1.70.0",
    # protobuf >=7.35 (BSR gencode 7.35.0) and <8 so a protobuf-8 gencode break
    # cannot land silently — the gencode/runtime guarantee requires
    # gencode <= runtime. Lowering the floor breaks `from cap.v0.core import *_pb2`.
    "protobuf>=7.35.0,<8",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# NOTE: code generation is NOT a runtime dependency of the SDK. The protobuf and
# gRPC Python bindings are generated by `buf` from cap-spec/buf.gen.yaml using
# BSR remote plugins (protocolbuffers/python + grpc/python) and consumed as
# generated sources; the SDK never invokes grpcio-tools. The historical
# `codegen = [grpcio-tools>=1.81.0rc1]` extra was removed because it was
# unsatisfiable against protobuf>=7.35 (grpcio-tools bundles a protobuf<6
# runtime), which broke `uv sync`/`uv lock` from a clean checkout.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Repository = "https://github.com/R-Okauchi/cap"
Documentation = "https://github.com/R-Okauchi/cap/tree/main/cap-spec/docs/specification"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    "../../cap-spec/gen/python",
    ".",
]
