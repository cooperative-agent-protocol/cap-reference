# CAP MQTT Broker Configuration — TLS enabled
# Use this configuration for production or security testing.
#
# Prerequisites:
#   1. Generate certificates with cap-reference/python/cap_sdk/security/cert_gen.py
#   2. Place ca.crt, server.crt, server.key in /mosquitto/certs/
#
# Usage in docker-compose:
#   volumes:
#     - ./cap-reference/mosquitto/mosquitto-tls.conf:/mosquitto/config/mosquitto.conf:ro
#     - ./certs:/mosquitto/certs:ro

# TLS listener (MQTTS on port 8883)
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3

# WebSocket over TLS (WSS on port 9443)
listener 9443
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.3

# ACL — role-based topic access
# Format: topic [read|write|readwrite] <pattern>
# %u = username (from client cert CN)
acl_file /mosquitto/config/acl.conf

# Logging
log_type all
log_dest stdout

# Persistence
persistence false

# Message size limit (4 MB, matching CAP spec)
message_size_limit 4194304

# Disable anonymous access
allow_anonymous false
