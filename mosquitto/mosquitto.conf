# CAP MQTT Broker Configuration (development/testing)
# Production deployments MUST enable TLS and authentication.

# Listener for plain MQTT (development only)
listener 1883
protocol mqtt
allow_anonymous true

# Listener for WebSocket (optional, for dashboard)
listener 9001
protocol websockets
allow_anonymous true

# Logging
log_type all
log_dest stdout

# Persistence
persistence false

# Message size limit (4 MB, matching CAP spec)
message_size_limit 4194304
