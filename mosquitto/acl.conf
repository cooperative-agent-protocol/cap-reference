# CAP MQTT ACL Configuration
#
# Roles (mapped from client certificate CN):
#   site_agent     — full read/write on all CAP topics
#   machine_agent  — write own topics, read work orders
#   observer       — read only
#
# Topic structure:
#   cap/v0/{site_id}/work_orders/{machine_id}    — Site → Machine
#   cap/v0/{site_id}/progress/{machine_id}       — Machine → Site
#   cap/v0/{site_id}/heartbeat/{machine_id}      — Machine → Site
#   cap/v0/{site_id}/events/#                    — All events
#   cap/v0/{site_id}/dialogue/#                  — Agent dialogue

# Site Agent: full access
user site-agent
topic readwrite cap/v0/#

# Machine Agents: write own progress/heartbeat, read own work orders
pattern write cap/v0/+/progress/%u
pattern write cap/v0/+/heartbeat/%u
pattern write cap/v0/+/events/%u
pattern write cap/v0/+/dialogue/%u
pattern read cap/v0/+/work_orders/%u

# Observer: read-only access to all topics
user observer
topic read cap/v0/#
